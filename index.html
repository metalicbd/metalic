<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- মেটালিক অফিশিয়াল ফেভিকন -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- ব্রাউজার ট্যাবে টাইটেল -->
    <title>METALIC</title>
    
    <!-- মোবাইল ব্রাউজার প্রিমিয়াম ডার্ক থিম কালার -->
    <meta name="theme-color" content="#0a0a0a" />
    
    <!-- গুগল এসইও (SEO) মেটা ডেসক্রিপশন ও কীওয়ার্ডস -->
    <meta name="description" content="Transform your living space with jaw-dropping 1mm steel metal posters. Ultra-vibrant, scratch-resistant & magnet-mounted wall art. Order yours now!" />
    <meta name="keywords" content="metalicbd, metalic, unique metal poster designs, jaw-dropping wall art, metal posters bangladesh, anime metal posters, gaming metal art, 1mm steel posters" />

    <!-- Open Graph (WhatsApp, Messenger, Facebook, Telegram) প্রিভিউ মেটা ট্যাগ -->
    <meta property="og:site_name" content="METALIC" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://metalicbd.vercel.app/" />
    <meta property="og:title" content="METALIC — Premium Metal Wall Art & Posters" />
    <meta property="og:description" content="Transform your living space with jaw-dropping 1mm steel metal posters. Ultra-vibrant colors, scratch-resistant & effortless magnetic mounting. Discover the collection!" />
    
    <!-- সোশ্যাল ব্যানার ইমেজ (Large Preview) -->
    <meta property="og:image" content="https://metalicbd.vercel.app/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://metalicbd.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="METALIC Premium Metal Wall Art Posters" />

    <!-- Twitter / X Large Summary Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://metalicbd.vercel.app/" />
    <meta name="twitter:title" content="METALIC — Premium Metal Wall Art & Posters" />
    <meta name="twitter:description" content="Transform your living space with jaw-dropping 1mm steel metal posters. Ultra-vibrant, scratch-resistant & magnet-mounted wall art." />
    <meta name="twitter:image" content="https://metalicbd.vercel.app/og-image.jpg" />
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-primary antialiased selection:bg-primary selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
